services:
  # ─── PostgreSQL ─────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: stockbase
      POSTGRES_USER: stockbase
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stockbase_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Монтируем папку с init-скриптами, а не одиночный файл —
      # так Docker под Windows не создаёт случайно директорию вместо файла.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockbase"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── WebSocket Realtime Server ──────────────────────────
  # Лёгкий push-сервер, рассылает сигналы "данные изменились"
  # всем подключённым клиентам. Backend шлёт broadcast сюда,
  # фронт подписан через ws://.../ws
  websocket:
    build:
      context: ./docker/websocket
    restart: unless-stopped
    environment:
      WS_PORT: 8081
      WS_HTTP_PORT: 8082
    ports:
      - "8081:8081"
    expose:
      - "8082"

  # ─── Backend API (Python + Flask) ───────────────────────
  backend:
    build:
      context: ./docker/backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://stockbase:${DB_PASSWORD:-stockbase_secret}@db:5432/stockbase
      DB_SCHEMA: public
      PORT: 8080
      # Внутренний адрес WS-сервера для broadcast-сигналов
      WS_BROADCAST_URL: http://websocket:8082/broadcast
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      websocket:
        condition: service_started

  # ─── Frontend (Vite build + Nginx) ─────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
      - websocket

  # ─── Авто-бэкап БД ───────────────────────────────────────
  # Каждые BACKUP_INTERVAL_HOURS часов делает pg_dump в ./backups,
  # хранит последние BACKUP_KEEP файлов, остальные автоудаляются.
  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: stockbase
      PGPASSWORD: ${DB_PASSWORD:-stockbase_secret}
      PGDATABASE: stockbase
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-6}
      BACKUP_KEEP: ${BACKUP_KEEP:-20}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /backups
        echo "[backup] interval=${BACKUP_INTERVAL_HOURS}h keep=${BACKUP_KEEP}"
        while true; do
          TS=$$(date +%Y%m%d_%H%M%S)
          FILE="/backups/stockbase_$$TS.sql.gz"
          echo "[backup] $$TS → $$FILE"
          if pg_dump --no-owner --no-privileges | gzip > "$$FILE.tmp"; then
            mv "$$FILE.tmp" "$$FILE"
            echo "[backup] OK $$(du -h "$$FILE" | cut -f1)"
          else
            echo "[backup] FAILED"
            rm -f "$$FILE.tmp"
          fi
          # Удаляем старые, оставляем последние BACKUP_KEEP
          ls -1t /backups/stockbase_*.sql.gz 2>/dev/null | tail -n +$$((BACKUP_KEEP+1)) | xargs -r rm -f
          sleep $$((BACKUP_INTERVAL_HOURS*3600))
        done

volumes:
  pgdata: